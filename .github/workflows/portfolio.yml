name: Daily Portfolio Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * *'

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests
      - name: Create email config from secrets
        run: |
          python3 -c "import json, os; json.dump({'smtp_user': os.environ['GMAIL_USER'], 'smtp_pass': os.environ['GMAIL_PASS'], 'to': os.environ['GMAIL_TO']}, open('email_config.json', 'w'))"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
      - name: Run portfolio tracker
        run: python portfolio_tracker.py
